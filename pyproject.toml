[project]
name = "repo-man"
version = "0.1.0"
description = "Scan and manage a directory of local git repos"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
repo-man = "repo_man.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_man"]

[tool.pytest.ini_options]
testpaths = ["tests"]
